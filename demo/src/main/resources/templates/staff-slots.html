<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Pickup Slots</title>
</head>
<body>

<h1>Manage Pickup Slots</h1>

<h2>Create New Slot</h2>

<form action="/staff/slots" method="post">

    <label>Start Time:</label>
    <input
        type="datetime-local"
        name="startTime"
        required>

    <br><br>

    <label>End Time:</label>
    <input
        type="datetime-local"
        name="endTime"
        required>

    <br><br>

    <button type="submit">
        Create Slot
    </button>

</form>

<h2>Existing Slots</h2>

<div th:each="slot : ${slots}">

    <p>
        <span th:text="${slot.startTime}"></span>
        -
        <span th:text="${slot.endTime}"></span>
    </p>

    <form
        th:action="@{/staff/slots/{id}/delete(id=${slot.ID})}"
        method="post">

        <button type="submit">
            Remove Slot
        </button>
    </form>

    <br>

</div>

<a href="/staff/orders">View Orders</a>

<br><br>

<a href="/">Back Home</a>

</body>
</html>
